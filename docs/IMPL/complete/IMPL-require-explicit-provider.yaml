    - number: 1
      agents:
        - id: A
          task: |
            ## Agent A: Remove Cascade Auto-Detection from decompose_skill

            **What to implement:**
            Remove the cascade auto-detection fallback in `src/decompose/mod.rs` (lines 60-63)
            and replace with an error when no provider is specified.

            **Current behavior (lines 49-63):**
            ```rust
            let detection = if let Some(ref provider_name) = options.provider {
                // User specified a provider explicitly
                let result = semantic_analyzer::new_analyzer_by_name(provider_name);
                if result.analyzer.is_none() {
                    eprintln!("{}", result.error_message());
                    return Err(Error::ValidationError(format!(
                        "Failed to initialize provider '{}'",
                        provider_name
                    )));
                }
                result
            } else {
                // Auto-detect using cascade
                semantic_analyzer::new_analyzer()
            };
            ```

            **Target behavior:**
            ```rust
            let detection = if let Some(ref provider_name) = options.provider {
                // User specified a provider explicitly (including "none")
                let result = semantic_analyzer::new_analyzer_by_name(provider_name);
                if result.analyzer.is_none() && provider_name != "none" {
                    eprintln!("{}", result.error_message());
                    return Err(Error::ValidationError(format!(
                        "Failed to initialize provider '{}'",
                        provider_name
                    )));
                }
                result
            } else {
                // No provider specified - require explicit selection
                eprintln!("Error: --provider flag is required for semantic analysis.\n");
                eprintln!("Available providers:");
                eprintln!("  - anthropic-api (requires ANTHROPIC_API_KEY)");
                eprintln!("  - claude-cli (requires 'claude' binary on PATH)");
                eprintln!("  - openai-api (requires OPENAI_API_KEY)");
                eprintln!("  - gemini-api (requires GOOGLE_API_KEY)");
                eprintln!("  - gemini-cli (requires 'gemini' binary on PATH)");
                eprintln!("  - copilot-cli (requires 'copilot' binary on PATH)");
                eprintln!("  - none (mechanical splitting without semantic analysis)\n");
                return Err(Error::ValidationError(
                    "--provider flag is required".to_string()
                ));
            };
            ```

            **Key changes:**
            1. Remove the `else { semantic_analyzer::new_analyzer() }` branch entirely
            2. Add error branch that prints provider list and returns ValidationError
            3. Update the provider_name validation to allow "none" without error
            4. Keep the existing "Using <provider>" status message (lines 66-71)

            **Unit tests to update (E37 correction):**
            The module contains 6 unit tests (lines 271-447) that use `provider: None` in
            `DecomposeOptions`. After removing cascade auto-detection, these tests will fail.
            Update all 6 tests to use `provider: Some("none".to_string())` instead:
            - `test_decompose_skill_dry_run_does_not_write` (line 272)
            - `test_decompose_skill_dry_run_returns_preview` (line 302)
            - `test_decompose_skill_creates_directory_structure` (line 324)
            - `test_decompose_skill_writes_reference_files` (line 361)
            - `test_decompose_skill_sets_script_executable` (line 400)
            - `test_decompose_skill_validates_path` (line 435)

            **Verification gate:**
            ```bash
            cargo build
            cargo fmt --check || cargo fmt
            cargo clippy -- -D warnings
            cargo test --test integration_test -- --test-threads=1
            ```

            **Constraints:**
            - Do NOT modify `semantic_analyzer::new_analyzer()` or `new_analyzer_by_name()` functions
            - Do NOT change `DetectionResult` struct
            - Keep existing provider status messages (lines 66-71) unchanged
            - Preserve the error handling for failed explicit provider initialization
          files:
