        - id: B
          task: |
            ## Agent B: Add "none" Provider Support to Semantic Analyzer

            **What to implement:**
            Add "none" as a valid provider name to `new_analyzer_by_name()` in
            `src/decompose/semantic_analyzer.rs`. When "none" is specified, return a
            DetectionResult with no analyzer (mechanical splitting mode).

            **Current behavior (lines 269-290):**
            ```rust
            pub fn new_analyzer_by_name(provider_name: &str) -> DetectionResult {
                let provider = match provider_name.to_lowercase().as_str() {
                    "anthropic-api" => Provider::AnthropicApi,
                    "claude-cli" => Provider::AnthropicCli,
                    "openai-api" => Provider::OpenAiApi,
                    "gemini-api" => Provider::GeminiApi,
                    "gemini-cli" => Provider::GeminiCli,
                    "copilot-cli" => Provider::CopilotCli,
                    _ => {
                        return DetectionResult {
                            analyzer: None,
                            attempts: vec![(
                                provider_name.to_string(),
                                DetectionFailure::BinaryNotFound(format!(
                                    "Unknown provider '{}'. Valid: anthropic-api, ...",
                                    provider_name
                                )),
                            )],
                            provider_name: None,
                        };
                    }
                };
                // ...
            }
            ```

            **Target behavior:**
            ```rust
            pub fn new_analyzer_by_name(provider_name: &str) -> DetectionResult {
                // Special case: "none" = mechanical splitting (no semantic analysis)
                if provider_name.to_lowercase() == "none" {
                    return DetectionResult {
                        analyzer: None,
                        attempts: vec![],
                        provider_name: Some("none (mechanical splitting)".to_string()),
                    };
                }

                let provider = match provider_name.to_lowercase().as_str() {
                    "anthropic-api" => Provider::AnthropicApi,
                    "claude-cli" => Provider::AnthropicCli,
                    "openai-api" => Provider::OpenAiApi,
                    "gemini-api" => Provider::GeminiApi,
                    "gemini-cli" => Provider::GeminiCli,
                    "copilot-cli" => Provider::CopilotCli,
                    _ => {
                        return DetectionResult {
                            analyzer: None,
                            attempts: vec![(
                                provider_name.to_string(),
                                DetectionFailure::BinaryNotFound(format!(
                                    "Unknown provider '{}'. Valid: anthropic-api, claude-cli, openai-api, gemini-api, gemini-cli, copilot-cli, none",
                                    provider_name
                                )),
                            )],
                            provider_name: None,
                        };
                    }
                };
                // ... rest unchanged
            }
            ```

            **Key changes:**
            1. Add early return at top of function for `provider_name == "none"`
            2. Return DetectionResult with `analyzer: None` and `provider_name: Some("none ...")`
            3. Update error message in the wildcard match to include "none" in valid list

            **Verification gate:**
            ```bash
            cargo build
            cargo fmt --check || cargo fmt
            cargo clippy -- -D warnings
            cargo test -p agentskills --lib decompose::semantic_analyzer::tests
            ```

            **Constraints:**
            - Do NOT modify the Provider enum (no new variant needed for "none")
            - Do NOT change `new_analyzer()` function
            - Do NOT modify `DetectionResult` struct definition
            - Keep all existing tests passing
