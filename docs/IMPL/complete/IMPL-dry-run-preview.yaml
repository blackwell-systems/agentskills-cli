            ## Interfaces to implement

            In src/upgrade/mod.rs:

            ```rust
            pub async fn upgrade_skill(
                skill_path: &Path,
                options: &UpgradeOptions,
            ) -> Result<Option<PreviewData>, Error>
            ```

            Change the function to:
            - Run steps 1-3 as before (analyze_bloat, create analyzer, split_content)
            - In dry-run mode (options.dry_run == true):
              - Build PreviewData from analysis + split_result
              - Return Ok(Some(preview_data))
            - In non-dry-run mode:
              - Write files as before (steps 4-5)
